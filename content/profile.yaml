headline:
  es: "Desarrollador Python · Software local, ligero y terminado"
  en: "Python developer · Local-first software, lightweight and finished"

summary:
  es: >-
    Tengo 16 años y programo desde 2024. En ese tiempo he publicado un paquete
    de bioinformática en PyPI, una calculadora científica que funciona sin
    conexión en navegador y escritorio, y un asistente de voz que corre en
    local. Los tres comparten la misma obsesión: que el software funcione en
    máquinas modestas y sin enviar datos fuera. Lo que mejor se me da es partir
    un problema grande en trozos resolubles y no soltarlo hasta que funciona.
  en: >-
    I'm 16 and I've been programming since 2024. In that time I've published a
    bioinformatics package on PyPI, a scientific calculator that works offline
    in the browser and on desktop, and a voice assistant that runs locally. All
    three share the same obsession: software that runs on modest hardware
    without sending data anywhere. What I do best is breaking a large problem
    into solvable pieces and not letting go until it works.

